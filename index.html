<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Calculadora Moderna</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --bg-color: #000000;
            --text-color: #ffffff;
            --preview-color: #8e8e93;
            --num-bg: #1c1c1e;
            --num-color: #ffffff;
            --op-bg: #2c3545;
            --op-color: #a8c7fa;
            --ac-bg: #3b4252;
            --ac-color: #8ab4f8;
            --equals-bg: #f1c40f;
            --equals-color: #000000;
            --top-icon-color: #ffffff;
            --history-bg: #121216;
        }

        .light-theme {
            --bg-color: #f8f9fa;
            --text-color: #202124;
            --preview-color: #5f6368;
            --num-bg: #f1f3f4;
            --num-color: #202124;
            --op-bg: #e8eaed;
            --op-color: #1a73e8;
            --ac-bg: #fce8e6;
            --ac-color: #c5221f;
            --equals-bg: #1a73e8;
            --equals-color: #ffffff;
            --top-icon-color: #202124;
            --history-bg: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        
        body {
            background-color: var(--bg-color);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden; /* Evita scroll en la página principal */
        }

        .calculator {
            background-color: var(--bg-color);
            width: 360px;
            max-width: 100%;
            height: 700px; /* Altura fija para que no se deforme */
            max-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            position: relative;
            overflow: hidden;
            border-radius: 24px;
        }

        /* Barra superior minimalista */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 5px 10px 10px 10px;
            flex-shrink: 0; /* Evita que se comprima */
        }
        .top-btn {
            background: none;
            border: none;
            cursor: pointer;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--top-icon-color);
        }
        .top-btn:hover {
            background-color: rgba(128, 128, 128, 0.2);
        }
        .top-btn svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }

        /* Panel de Historial Desplegable */
        .history-panel {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--history-bg);
            z-index: 10;
            display: flex;
            flex-direction: column;
            padding: 20px;
            transform: translateY(-100%);
            transition: transform 0.3s ease-in-out;
        }
        .history-panel.active {
            transform: translateY(0);
        }
        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            color: var(--text-color);
            font-size: 1.1rem;
            font-weight: bold;
        }
        .history-list {
            flex-grow: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            text-align: right;
            padding-right: 5px;
        }
        .history-item {
            cursor: pointer;
            padding: 8px;
            border-radius: 8px;
            transition: background 0.2s;
        }
        .history-item:hover {
            background-color: rgba(128, 128, 128, 0.15);
        }
        .history-expr {
            font-size: 1.1rem;
            color: var(--preview-color);
        }
        .history-res {
            font-size: 1.4rem;
            font-weight: bold;
            color: var(--text-color);
        }
        .empty-history {
            color: var(--preview-color);
            text-align: center;
            margin-top: 50px;
            font-size: 1rem;
        }

        /* Pantalla Fija */
        .display {
            background-color: var(--bg-color);
            color: var(--text-color);
            text-align: right;
            padding: 15px 10px;
            height: 150px; /* Altura fija para que los botones no bajen */
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            margin-bottom: 10px;
            flex-shrink: 0;
            overflow: hidden;
        }
        
        .expression {
            font-size: 2.8rem;
            font-weight: 400;
            color: var(--text-color);
            letter-spacing: 1px;
            /* Hace que el texto largo se deslice en lugar de bajar de línea */
            white-space: nowrap; 
            overflow-x: auto; 
            overflow-y: hidden;
            scrollbar-width: none; /* Oculta scroll en Firefox */
            -ms-overflow-style: none; /* Oculta scroll en IE/Edge */
        }
        
        /* Oculta la barra de scroll en Chrome/Safari/Edge */
        .expression::-webkit-scrollbar {
            display: none; 
        }

        .preview {
            font-size: 1.4rem;
            color: var(--preview-color);
            height: 30px;
            margin-top: 5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Botonera */
        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 14px;
            flex-shrink: 0; /* Evita que se aplasten los botones */
        }
        button.calc-btn {
            aspect-ratio: 1 / 1;
            border-radius: 50%;
            border: none;
            font-size: 1.65rem;
            font-weight: 400;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: filter 0.15s ease, transform 0.1s ease;
        }
        button.calc-btn:hover {
            filter: brightness(1.2);
        }
        button.calc-btn:active {
            transform: scale(0.92);
        }
        .num {
            background-color: var(--num-bg);
            color: var(--num-color);
        }
        .op {
            background-color: var(--op-bg);
            color: var(--op-color);
            font-size: 1.75rem;
        }
        .ac {
            background-color: var(--ac-bg);
            color: var(--ac-color);
            font-size: 1.5rem;
            font-weight: 500;
        }
        .equals {
            background-color: var(--equals-bg);
            color: var(--equals-color);
            font-size: 1.9rem;
            font-weight: bold;
        }

        /* Control de iconos de tema según modo */
        .sun-icon { display: block; }
        .moon-icon { display: none; }
        .light-theme .sun-icon { display: none; }
        .light-theme .moon-icon { display: block; }
    </style>
</head>
<body>

<div class="calculator" id="calculator">
    <!-- Panel deslizante de Historial -->
    <div class="history-panel" id="historyPanel">
        <div class="history-header">
            <span>Historial</span>
            <button class="top-btn" onclick="toggleHistory()">✕</button>
        </div>
        <div class="history-list" id="historyList">
            <div class="empty-history">No hay historial aún</div>
        </div>
        <button class="top-btn" style="width:100%; border-radius:8px; margin-top:10px; background:rgba(128,128,128,0.2); font-size:0.9rem; padding:8px; height:auto;" onclick="clearHistory()">Borrar historial</button>
    </div>

    <!-- Barra superior -->
    <div class="top-bar">
        <!-- Icono de Reloj (Historial) -->
        <button class="top-btn" onclick="toggleHistory()" title="Historial">
            <svg viewBox="0 0 24 24">
                <path d="M13 3a9 9 0 0 0-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42A8.954 8.954 0 0 0 13 21a9 9 0 0 0 0-18zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/>
            </svg>
        </button>
        <!-- Icono de Sol / Luna -->
        <button class="top-btn" onclick="toggleTheme()" title="Cambiar Tema">
            <svg class="sun-icon" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="4.5"/>
                <path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M5.05 5.05l1.77 1.77M17.18 17.18l1.77 1.77M5.05 18.95l1.77-1.77M17.18 6.82l1.77-1.77" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
            </svg>
            <svg class="moon-icon" viewBox="0 0 24 24">
                <path d="M12.3 2.02c-5.51.39-9.8 5.15-9.8 10.74 0 5.95 4.83 10.78 10.79 10.78 5.59 0 10.35-4.29 10.74-9.8-3.08.77-6.52-.08-8.91-2.47-2.39-2.39-3.24-5.83-2.47-8.91z"/>
            </svg>
        </button>
    </div>

    <div class="display">
        <div class="expression" id="expression">0</div>
        <div class="preview" id="preview"></div>
    </div>
    
    <div class="buttons">
        <button class="calc-btn ac" onclick="clearAll()">AC</button>
        <button class="calc-btn op" onclick="addParenthesis()">( )</button>
        <button class="calc-btn op" onclick="appendValue('%')">%</button>
        <button class="calc-btn op" onclick="appendValue('÷')">÷</button>
        
        <button class="calc-btn num" onclick="appendValue('7')">7</button>
        <button class="calc-btn num" onclick="appendValue('8')">8</button>
        <button class="calc-btn num" onclick="appendValue('9')">9</button>
        <button class="calc-btn op" onclick="appendValue('×')">×</button>
        
        <button class="calc-btn num" onclick="appendValue('4')">4</button>
        <button class="calc-btn num" onclick="appendValue('5')">5</button>
        <button class="calc-btn num" onclick="appendValue('6')">6</button>
        <button class="calc-btn op" onclick="appendValue('-')">-</button>
        
        <button class="calc-btn num" onclick="appendValue('1')">1</button>
        <button class="calc-btn num" onclick="appendValue('2')">2</button>
        <button class="calc-btn num" onclick="appendValue('3')">3</button>
        <button class="calc-btn op" onclick="appendValue('+')">+</button>
        
        <button class="calc-btn num" onclick="appendValue('0')">0</button>
        <button class="calc-btn num" onclick="appendDecimal()">.</button>
        <button class="calc-btn num" onclick="deleteLast()">⌫</button>
        <button class="calc-btn equals" onclick="calculateResult()">=</button>
    </div>
</div>

<script>
    let currentExpr = '';
    let history = [];
    
    // Referencias al DOM
    const exprDisplay = document.getElementById('expression');
    const previewDisplay = document.getElementById('preview');
    const historyPanel = document.getElementById('historyPanel');
    const historyList = document.getElementById('historyList');
    const calculator = document.getElementById('calculator');

    // Cargar estado inicial (Tema e Historial)
    window.onload = () => {
        const savedTheme = localStorage.getItem('calcTheme');
        if (savedTheme === 'light') {
            calculator.classList.add('light-theme');
        }
        
        const savedHistory = localStorage.getItem('calcHistory');
        if (savedHistory) {
            history = JSON.parse(savedHistory);
            renderHistory();
        }
        updateScreen(); // Para asegurar scroll inicial
    };

    function updateScreen() {
        exprDisplay.innerText = currentExpr === '' ? '0' : currentExpr;
        
        // Auto-scroll al final de la expresión
        exprDisplay.scrollLeft = exprDisplay.scrollWidth;
        
        calculatePreview();
    }

    function appendValue(val) {
        const operators = ['+', '-', '×', '÷'];
        const lastChar = currentExpr.slice(-1);

        // Evitar dos operadores seguidos (reemplazar el anterior)
        if (operators.includes(val) && operators.includes(lastChar)) {
            currentExpr = currentExpr.slice(0, -1) + val;
            updateScreen();
            return;
        }

        // Evitar empezar con operadores inválidos
        if (currentExpr === '' && ['+', '×', '÷', '%', ')'].includes(val)) return;

        // Si el último caracter es ')' o '%' y ponemos un número, agregar '×' automáticamente
        if ((lastChar === ')' || lastChar === '%') && !isNaN(val)) {
            currentExpr += '×' + val;
        } else {
            currentExpr += val;
        }
        updateScreen();
    }

    function appendDecimal() {
        // Obtener el último número ingresado
        const parts = currentExpr.split(/[\+\-\×\÷\(\)]/);
        const lastNumber = parts[parts.length - 1];
        
        // Si el último número ya tiene un punto, no hacer nada
        if (lastNumber.includes('.')) return;

        const lastChar = currentExpr.slice(-1);

        // Si el último caracter es un operador o paréntesis, agregar 0. 
        if (lastChar === '' || ['+', '-', '×', '÷', '('].includes(lastChar)) {
            currentExpr += '0.';
        } else {
            currentExpr += '.';
        }
        updateScreen();
    }

    function addParenthesis() {
        const openCount = (currentExpr.match(/\(/g) || []).length;
        const closeCount = (currentExpr.match(/\)/g) || []).length;
        const lastChar = currentExpr.slice(-1);

        // Si hay paréntesis abiertos y el último caracter permite cerrar
        if (openCount > closeCount && (!isNaN(lastChar) || lastChar === ')' || lastChar === '%')) {
            currentExpr += ')';
        } else {
            // Abrir paréntesis. Si el último es número o ')', agregar multiplicación
            if (currentExpr !== '' && (!isNaN(lastChar) || lastChar === ')' || lastChar === '%')) {
                currentExpr += '×(';
            } else {
                currentExpr += '(';
            }
        }
        updateScreen();
    }

    function clearAll() {
        currentExpr = '';
        previewDisplay.innerText = '';
        updateScreen();
    }

    function deleteLast() {
        currentExpr = currentExpr.slice(0, -1);
        updateScreen();
    }

    // Lógica matemática para porcentajes
    function processPercentages(expr) {
        return expr.replace(/(\d+(?:\.\d+)?)\s*([\+\-])\s*(\d+(?:\.\d+)?)%/g, '$1 $2 ($1 * $3 / 100)')
                   .replace(/(\d+(?:\.\d+)?)\s*([*\/])\s*(\d+(?:\.\d+)?)%/g, '$1 $2 ($3 / 100)')
                   .replace(/(\d+(?:\.\d+)?)%/g, '($1 / 100)');
    }

    function evaluateExpression(expr) {
        try {
            if (expr === '') return null;

            // Cerrar paréntesis automáticamente si faltan
            const openCount = (expr.match(/\(/g) || []).length;
            const closeCount = (expr.match(/\)/g) || []).length;
            let cleanExpr = expr + ')'.repeat(Math.max(0, openCount - closeCount));

            // Convertir porcentajes
            cleanExpr = processPercentages(cleanExpr);

            // Reemplazar signos visuales por matemáticos
            cleanExpr = cleanExpr.replace(/×/g, '*').replace(/÷/g, '/');

            // Si termina en operador, no evaluar (esperar a que termine de escribir)
            if (/[\+\-\*\/\(]$/.test(cleanExpr)) return null;

            const result = Function('"use strict";return (' + cleanExpr + ')')();
            
            if (!isFinite(result) || isNaN(result)) return 'Error'; // División por cero o NaN
            
            return Math.round(result * 1000000000) / 1000000000; // Redondear a 9 decimales
        } catch {
            return null;
        }
    }

    function calculatePreview() {
        if (currentExpr === '') {
            previewDisplay.innerText = '';
            return;
        }
        const res = evaluateExpression(currentExpr);
        // Mostrar la previsualización solo si hay un resultado válido
        if (res !== null && res !== 'Error' && res.toString() !== currentExpr) {
            previewDisplay.innerText = res;
        } else {
            previewDisplay.innerText = '';
        }
    }

    function calculateResult() {
        const originalExpr = currentExpr;
        const res = evaluateExpression(currentExpr);
        
        if (res === 'Error') {
            previewDisplay.innerText = 'No se puede dividir por 0';
            return;
        }

        if (res !== null) {
            // Guardar en historial
            history.unshift({ expr: originalExpr, result: res.toString() });
            if (history.length > 50) history.pop(); // Limitar a 50 elementos
            localStorage.setItem('calcHistory', JSON.stringify(history)); // Guardar en memoria
            renderHistory();

            // Actualizar pantalla
            currentExpr = res.toString();
            previewDisplay.innerText = '';
            updateScreen();
        }
    }

    function toggleHistory() {
        historyPanel.classList.toggle('active');
    }

    function renderHistory() {
        if (history.length === 0) {
            historyList.innerHTML = '<div class="empty-history">No hay historial aún</div>';
            return;
        }
        historyList.innerHTML = '';
        history.forEach((item) => {
            const div = document.createElement('div');
            div.className = 'history-item';
            div.innerHTML = `
                <div class="history-expr">${item.expr}</div>
                <div class="history-res">= ${item.result}</div>
            `;
            div.onclick = () => {
                currentExpr = item.result;
                updateScreen();
                toggleHistory();
            };
            historyList.appendChild(div);
        });
    }

    function clearHistory() {
        history = [];
        localStorage.removeItem('calcHistory'); // Borrar de memoria
        renderHistory();
    }

    function toggleTheme() {
        calculator.classList.toggle('light-theme');
        // Guardar preferencia en memoria
        if (calculator.classList.contains('light-theme')) {
            localStorage.setItem('calcTheme', 'light');
        } else {
            localStorage.setItem('calcTheme', 'dark');
        }
    }
</script>
<script>
  // Registro del Service Worker (PWA)
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js');
  }
</script>
</body>
</html>
